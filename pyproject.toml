[project]
name = "langchain-graph-study"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "langchain>=1.3.12",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.4",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.0",
    "rich>=15.0.0",
    "rprint>=0.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study"]

[tool.uv.pip]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
